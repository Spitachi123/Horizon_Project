<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ज्ञानSetu | Current Affairs</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body.divedu { background: var(--bg-main); }
  .desk-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 50px; }
  .desk-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .desk-head h1 { font-size: 22px; font-weight: 800; display:flex; align-items:center; gap:10px; }
  .desk-head p { font-size:13px; color:var(--text-muted); margin-top:4px; }
  .ca-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom: 16px; }
  .ca-updated { font-size: 11.5px; color: var(--text-muted); display:flex; align-items:center; gap:6px; }
  .ca-refresh-btn { border:1.5px solid var(--panel-border); background:var(--surface-white); color:var(--current-accent); width:34px; height:34px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .ca-refresh-btn:hover { background: var(--student-bg); }
  .ca-refresh-btn.spinning i { animation: ca-spin 0.8s linear infinite; }
  @keyframes ca-spin { to { transform: rotate(360deg); } }

  .ca-tabs { display:flex; gap:8px; margin-bottom: 18px; flex-wrap:wrap; }
  .ca-tab { border:1.5px solid var(--panel-border); background:var(--surface-white); color:var(--text-muted); padding:9px 16px; border-radius:20px; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .ca-tab .ca-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .ca-tab.active { background: var(--ca-tab-color, var(--current-accent)); color:#fff; border-color: var(--ca-tab-color, var(--current-accent)); }
  .ca-tab.active .ca-dot { background:#fff; }
  .ca-tab-count { font-size:10.5px; opacity:0.75; }

  .ca-panel { background: var(--surface-white); border:1px solid var(--panel-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 10px; min-height: 360px; }
  .ca-list { display:flex; flex-direction:column; }
  .ca-item { display:flex; gap:14px; align-items:flex-start; padding: 14px 12px; border-radius: var(--radius-sm); text-decoration:none; color:inherit; }
  .ca-item:hover { background: var(--bg-main); }
  .ca-item + .ca-item { border-top: 1px solid var(--panel-border); }
  .ca-item-bullet { width:9px; height:9px; border-radius:50%; margin-top:7px; flex-shrink:0; }
  .ca-item-body { flex:1; min-width:0; }
  .ca-item-title { font-size:14px; font-weight:700; color: var(--text-main); line-height:1.4; }
  .ca-item-meta { margin-top:5px; font-size:11.5px; color: var(--text-muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ca-item-source { font-weight:700; }
  .ca-item-open { color: var(--text-muted); font-size:12px; flex-shrink:0; margin-top:8px; }

  .empty-hint { color: var(--text-muted); font-size: 13.5px; text-align:center; padding: 60px 20px; }

  /* --- Nepal-focused widgets: gold/silver strip + this-month calendar --- */
  .np-widgets { display:flex; flex-direction:column; gap:12px; padding: 10px 10px 4px; }
  .np-gs-strip { display:flex; gap:10px; flex-wrap:wrap; }
  .np-gs-card { flex:1; min-width:220px; display:flex; align-items:flex-start; gap:10px; background: linear-gradient(135deg, #FFF7ED, #FEF3E2); border:1px solid #FDE0B0; border-radius: var(--radius-sm); padding: 12px 14px; text-decoration:none; color:inherit; }
  .np-gs-card i { color:#D97706; font-size:15px; margin-top:2px; }
  .np-gs-card-title { font-size:12.5px; font-weight:700; color:#7C2D12; line-height:1.4; }
  .np-gs-card-meta { font-size:10.5px; color:#92603A; margin-top:4px; }
  .np-gs-empty { font-size:12px; color: var(--text-muted); padding: 10px 4px; }

  .np-rate-strip { display:flex; gap:10px; flex-wrap:wrap; }
  .np-rate-card { flex:1; min-width:180px; background: linear-gradient(135deg, #FFFBEB, #FEF3E2); border:1px solid #FDE0B0; border-radius: var(--radius-sm); padding: 12px 14px; }
  .np-rate-card.silver { background: linear-gradient(135deg, #F8FAFC, #F1F5F9); border-color:#E2E8F0; }
  .np-rate-head { display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; color:#92603A; text-transform:uppercase; letter-spacing:.3px; }
  .np-rate-card.silver .np-rate-head { color:#475569; }
  .np-rate-head i { color:#D97706; }
  .np-rate-card.silver .np-rate-head i { color:#64748B; }
  .np-rate-price { font-size:19px; font-weight:800; color: var(--text-main); margin-top:6px; }
  .np-rate-price span { font-size:11px; font-weight:700; color: var(--text-muted); }
  .np-rate-change { font-size:11.5px; font-weight:700; margin-top:4px; }
  .np-rate-change.up { color:#059669; }
  .np-rate-change.down { color:#DC2626; }
  .np-rate-foot { display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color: var(--text-muted); margin-top:10px; }
  .np-rate-foot a { color: var(--current-accent); font-weight:700; text-decoration:none; }

  .np-conflict { background: var(--bg-main); border:1px solid var(--panel-border); border-radius: var(--radius-sm); padding: 14px 16px; margin: 10px 10px 4px; }
  .np-conflict-head { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color: var(--text-main); margin-bottom:10px; }
  .np-conflict-head .pulse-dot { width:8px; height:8px; border-radius:50%; background:#DC2626; box-shadow:0 0 0 rgba(220,38,38,0.5); animation: np-pulse 1.8s infinite; }
  @keyframes np-pulse { 0% { box-shadow:0 0 0 0 rgba(220,38,38,0.45); } 70% { box-shadow:0 0 0 6px rgba(220,38,38,0); } 100% { box-shadow:0 0 0 0 rgba(220,38,38,0); } }
  .np-conflict-list { display:flex; flex-direction:column; gap:10px; }
  .np-conflict-row { display:block; text-decoration:none; color:inherit; padding:8px 0; }
  .np-conflict-row + .np-conflict-row { border-top:1px solid var(--panel-border); }
  .np-conflict-label { font-size:12px; font-weight:800; color:#B91C1C; }
  .np-conflict-title { font-size:12.5px; color: var(--text-main); margin-top:3px; line-height:1.4; }
  .np-conflict-meta { font-size:10.5px; color: var(--text-muted); margin-top:3px; }
  .np-conflict-empty { font-size:12px; color: var(--text-muted); }

  .np-cal { background: var(--bg-main); border:1px solid var(--panel-border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .np-cal-head { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; color: var(--text-main); margin-bottom:10px; }
  .np-cal-head i { color: var(--current-accent); }
  .np-cal-list { display:flex; flex-direction:column; gap:8px; }
  .np-cal-row { display:flex; gap:10px; align-items:flex-start; font-size:12.5px; }
  .np-cal-date { flex-shrink:0; width:56px; font-weight:800; color: var(--text-main); }
  .np-cal-body { flex:1; color: var(--text-main); line-height:1.4; }
  .np-cal-tag { display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.2px; text-transform:uppercase; padding:2px 7px; border-radius:20px; margin-left:7px; vertical-align:middle; }
  .np-cal-tag.holiday { background:#FEE2E2; color:#B91C1C; }
  .np-cal-tag.festival { background:#FFF0DB; color:#B45309; }
  .np-cal-tag.observance { background:#EEF2FF; color:#4338CA; }
  .np-cal-empty { font-size:12px; color: var(--text-muted); }
  .ca-error { color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius: var(--radius-sm); padding:14px 16px; font-size:13px; margin: 8px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .ca-retry-btn { border:1.5px solid #b91c1c; color:#b91c1c; background:#fff; font-size:11.5px; font-weight:800; padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
</style>

</head>
<body class="divedu">
<div class="bg-glow blob-1"></div>
<div class="bg-glow blob-2"></div>

<div class="desk-wrap">
  <div class="desk-head">
    <div>
      <h1><i class="fa-solid fa-newspaper" style="color:var(--current-accent);"></i> Current Affairs</h1>
      <p>The latest headlines from the last couple of days, refreshed automatically — Nepal, international, trade &amp; business, sports, and a Trending &amp; More tab with gold/silver rates, hiking &amp; travel picks.</p>
    </div>
    <span class="badge-pill"><i class="fa-solid fa-tower-broadcast"></i> Live feed</span>
  </div>

  <div class="ca-toolbar">
    <div class="ca-tabs" id="caTabs"></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="ca-updated" id="caUpdated"></span>
      <span id="caSourceBadge" style="display:none; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px;"></span>
      <button type="button" class="ca-refresh-btn" id="caRefreshBtn" title="Refresh now" onclick="loadNews(true)"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <div class="ca-panel">
    <div class="np-widgets" id="npWidgets" style="display:none;"></div>
    <div class="np-conflict" id="conflictWatch" style="display:none;"></div>
    <div class="ca-list" id="caList">
      <div class="empty-hint"><i class="fa-solid fa-spinner fa-spin" style="opacity:.5; font-size:18px;"></i><br><br>Loading the latest headlines…</div>
    </div>
  </div>
</div>

<div class="d-toast" id="toast"></div>

<script>
/* ============================================================
   CURRENT AFFAIRS — categorized live headlines.

   Talks to the same Cloudflare Worker as the other AI tools, using
   a new "news" task (see cloudflare-worker.js: handleNews) that
   reads live public RSS feeds server-side and returns an already-
   categorized, deduped, freshest-first JSON digest. No Gemini call
   involved here — this is a live read of external news, so there's
   no "offline mode" fallback the way the AI tools have; a failed
   fetch just shows a retry option per category.
   ============================================================ */

// Same worker as the other AI tools — keep in sync if redeployed elsewhere.
const NEWS_WORKER_URL = 'https://divedu-ai-proxy.pandusujan123.workers.dev';
const AUTO_REFRESH_MS = 10 * 60 * 1000; // matches the worker's edge-cache TTL, so this stays cheap

const CATEGORY_META = {
  nepal:         { label: 'Nepal News',       icon: 'fa-flag',          color: '#DC2626' },
  international: { label: 'International',     icon: 'fa-earth-asia',    color: '#2563EB' },
  trade:         { label: 'Trade & Business',  icon: 'fa-chart-line',    color: '#059669' },
  sports:        { label: 'Sports',             icon: 'fa-futbol',       color: '#0891B2' },
  other:         { label: 'Other',              icon: 'fa-layer-group',  color: '#7C3AED' },
  trending:      { label: 'Trending & More',    icon: 'fa-mountain',     color: '#EA580C' }
};
const CATEGORY_ORDER = ['nepal', 'international', 'trade', 'sports', 'other', 'trending'];

/* ------------------------------------------------------------
   IMPORTANT DAYS IN NEPAL — a small hand-curated calendar shown
   on the Nepal News tab ("This month in Nepal"). This is static
   content, not pulled from any feed: Nepali festival dates follow
   the lunar Bikram Sambat calendar and shift every Gregorian year,
   so there's no reliable public RSS/API for this — it needs a
   yearly refresh (best done once the new BS year's official
   holiday list is published, around mid-April/Baisakh 1).
   Sourced from the Government of Nepal's 2083 BS public holiday
   notice and Hamro Patro's 2083 BS calendar. Keyed by "YYYY-MM".
   tag: 'holiday' (public holiday), 'festival', or 'observance'
   (international/awareness day observed in Nepal, not a day off).
   ------------------------------------------------------------ */
const NEPAL_IMPORTANT_DAYS = {
  '2026-08': [
    { date: 'Aug 8',  title: 'National Soil Conservation Day', tag: 'observance' },
    { date: 'Aug 9',  title: "International Day of the World's Indigenous Peoples", tag: 'observance' },
    { date: 'Aug 12', title: 'International Youth Day', tag: 'observance' },
    { date: 'Aug 17', title: 'Nag Panchami & Singh Sankranti', tag: 'festival' },
    { date: 'Aug 19', title: 'World Photography Day / Tulsidas Jayanti', tag: 'observance' },
    { date: 'Aug 28', title: 'Janai Purnima (Raksha Bandhan)', tag: 'holiday' },
    { date: 'Aug 29', title: 'Gaijatra', tag: 'holiday' }
  ],
  '2026-09': [
    { date: 'Sep 4',  title: 'Shree Krishna Janmashtami', tag: 'holiday' },
    { date: 'Sep 7',  title: 'Civil Service Day', tag: 'observance' },
    { date: 'Sep 14', title: 'Haritalika Teej', tag: 'holiday' },
    { date: 'Sep 19', title: 'Constitution Day (Sambidhan Diwas)', tag: 'observance' },
    { date: 'Sep 25', title: 'Indra Jatra', tag: 'festival' }
  ],
  '2026-10': [
    { date: 'Oct 4',  title: 'Jitiya Parva', tag: 'festival' },
    { date: 'Oct 11', title: 'Ghatasthapana — Dashain begins', tag: 'holiday' },
    { date: 'Oct 17', title: 'Phulpati', tag: 'festival' },
    { date: 'Oct 18', title: 'Maha Ashtami', tag: 'holiday' },
    { date: 'Oct 20', title: 'Maha Navami', tag: 'holiday' },
    { date: 'Oct 21', title: 'Vijaya Dashami — Dashain Tika', tag: 'holiday' },
    { date: 'Oct 26', title: 'Kojagrat Purnima', tag: 'festival' }
  ],
  '2026-11': [
    { date: 'Nov 8',  title: 'Tihar begins — Kaag Tihar', tag: 'holiday' },
    { date: 'Nov 9',  title: 'Laxmi Puja', tag: 'holiday' },
    { date: 'Nov 10', title: 'Govardhan Puja / Nepal Sambat New Year', tag: 'holiday' },
    { date: 'Nov 11', title: 'Bhai Tika', tag: 'holiday' }
  ]
};

let newsData = { categories: {}, fetchedAt: null };
let activeCategory = 'nepal';
let autoRefreshTimer = null;

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'd-toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function timeAgo(pubDate) {
  if (!pubDate) return '';
  const t = Date.parse(pubDate);
  if (isNaN(t)) return '';
  const diffMs = Date.now() - t;
  if (diffMs < 0) return 'just now';
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.round(hrs / 24);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + 'd ago';
  return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function renderTabs() {
  const wrap = document.getElementById('caTabs');
  wrap.innerHTML = CATEGORY_ORDER.map(key => {
    const meta = CATEGORY_META[key];
    const count = (newsData.categories[key] || []).length;
    const active = key === activeCategory;
    return `<button type="button" class="ca-tab${active ? ' active' : ''}" style="${active ? `--ca-tab-color:${meta.color};` : ''}" onclick="selectCategory('${key}')">
      <span class="ca-dot" style="${active ? '' : `background:${meta.color};`}"></span>
      ${escapeHtml(meta.label)}
      ${count ? `<span class="ca-tab-count">(${count})</span>` : ''}
    </button>`;
  }).join('');
}

function selectCategory(key) {
  activeCategory = key;
  renderTabs();
  renderNepalWidgets();
  renderConflictWatch();
  renderList();
}

/* Today's actual gold/silver rate (numeric, scraped server-side from
   Hamro Patro) + "This month in Nepal" calendar — only shown above
   the headline list while the Nepal News tab is active. */
function renderNepalWidgets() {
  const wrap = document.getElementById('npWidgets');
  if (activeCategory !== 'nepal') { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }

  const rate = newsData.goldRate;
  const rateCard = (label, iconClass, cssClass, metal) => {
    if (!metal) return '';
    const dirIcon = metal.direction === 'increase' ? 'fa-arrow-up' : 'fa-arrow-down';
    const dirClass = metal.direction === 'increase' ? 'up' : 'down';
    return `<div class="np-rate-card ${cssClass}">
        <div class="np-rate-head"><i class="fa-solid ${iconClass}"></i> ${label} · per tola</div>
        <div class="np-rate-price">${escapeHtml(metal.pricePerTola)}</div>
        <div class="np-rate-change ${dirClass}"><i class="fa-solid ${dirIcon}"></i> ${escapeHtml(metal.changeAmount)} (${escapeHtml(metal.changePercent)})</div>
      </div>`;
  };

  let gsHtml;
  if (rate && (rate.gold || rate.silver)) {
    gsHtml = `<div>
      <div class="np-rate-strip">
        ${rateCard('Gold (Hallmark)', 'fa-coins', 'gold', rate.gold)}
        ${rateCard('Silver', 'fa-circle-dot', 'silver', rate.silver)}
      </div>
      <div class="np-rate-foot">
        <span>${rate.updated ? 'Updated ' + escapeHtml(rate.updated) : 'Live rate'}</span>
        <a href="${escapeHtml(rate.sourceUrl || 'https://www.hamropatro.com/en/gold')}" target="_blank" rel="noopener noreferrer">Source: Hamro Patro <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
      </div>
    </div>`;
  } else {
    // Scrape didn't come through this load — fall back to headline
    // links about gold/silver rates rather than showing nothing.
    const gsItems = (newsData.categories.goldsilver || []).slice(0, 2);
    gsHtml = gsItems.length
      ? `<div class="np-gs-strip">${gsItems.map(item => `
          <a class="np-gs-card" href="${escapeHtml(item.link || '#')}" target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-coins"></i>
            <div>
              <div class="np-gs-card-title">${escapeHtml(item.title)}</div>
              <div class="np-gs-card-meta">${item.source ? escapeHtml(item.source) + ' · ' : ''}${escapeHtml(timeAgo(item.pubDate)) || 'recent'}</div>
            </div>
          </a>`).join('')}</div>`
      : `<div class="np-gs-strip"><div class="np-gs-empty"><i class="fa-solid fa-coins"></i> Today's gold &amp; silver rate isn't in yet — try refreshing, or see <a href="https://www.hamropatro.com/en/gold" target="_blank" rel="noopener noreferrer">hamropatro.com</a>.</div></div>`;
  }

  const now = new Date();
  const monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const monthLabel = now.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  const days = NEPAL_IMPORTANT_DAYS[monthKey];
  const calHtml = `<div class="np-cal">
      <div class="np-cal-head"><i class="fa-solid fa-calendar-days"></i> Important days in Nepal — ${escapeHtml(monthLabel)}</div>
      <div class="np-cal-list">
        ${days && days.length ? days.map(d => `
          <div class="np-cal-row">
            <div class="np-cal-date">${escapeHtml(d.date)}</div>
            <div class="np-cal-body">${escapeHtml(d.title)}<span class="np-cal-tag ${d.tag}">${d.tag === 'holiday' ? 'Public holiday' : (d.tag === 'festival' ? 'Festival' : 'Observance')}</span></div>
          </div>`).join('') : `<div class="np-cal-empty">Calendar for ${escapeHtml(monthLabel)} hasn't been added yet — check hamropatro.com for this month's dates.</div>`}
      </div>
    </div>`;

  wrap.innerHTML = gsHtml + calHtml;
  wrap.style.display = 'flex';
}

/* Conflict Watch — one freshest real headline per tracked war/
   conflict, so it's obvious at a glance whether something is still
   ongoing, paused, or wrapped up. Only shown on the International
   tab. The list of which conflicts are tracked is hand-maintained
   server-side (CONFLICT_WATCH in the worker) — this just renders
   whatever the worker sends back. */
function renderConflictWatch() {
  const wrap = document.getElementById('conflictWatch');
  if (activeCategory !== 'international') { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }

  const items = newsData.conflicts || [];
  wrap.innerHTML = `<div class="np-conflict-head"><span class="pulse-dot"></span> Conflict Watch — latest on ongoing wars</div>
    <div class="np-conflict-list">
      ${items.length ? items.map(c => `
        <a class="np-conflict-row" href="${escapeHtml(c.link || '#')}" target="_blank" rel="noopener noreferrer">
          <div class="np-conflict-label">${escapeHtml(c.label)}</div>
          <div class="np-conflict-title">${escapeHtml(c.title)}</div>
          <div class="np-conflict-meta">${c.source ? escapeHtml(c.source) + ' · ' : ''}${escapeHtml(timeAgo(c.pubDate)) || 'recent'}</div>
        </a>`).join('') : `<div class="np-conflict-empty">Conflict updates aren't in yet — try refreshing in a bit.</div>`}
    </div>`;
  wrap.style.display = 'block';
}

function renderList() {
  const listEl = document.getElementById('caList');
  const meta = CATEGORY_META[activeCategory];
  const items = newsData.categories[activeCategory] || [];

  if (items.length === 0) {
    listEl.innerHTML = `<div class="empty-hint"><i class="fa-solid ${meta.icon}" style="opacity:.4; font-size:20px;"></i><br><br>No ${escapeHtml(meta.label.toLowerCase())} stories available right now — try refreshing in a bit.</div>`;
    return;
  }

  listEl.innerHTML = items.map(item => `
    <a class="ca-item" href="${escapeHtml(item.link || '#')}" target="_blank" rel="noopener noreferrer">
      <span class="ca-item-bullet" style="background:${meta.color};"></span>
      <div class="ca-item-body">
        <div class="ca-item-title">${escapeHtml(item.title)}</div>
        <div class="ca-item-meta">
          ${item.source ? `<span class="ca-item-source">${escapeHtml(item.source)}</span> &middot;` : ''}
          <span>${escapeHtml(timeAgo(item.pubDate)) || 'recent'}</span>
        </div>
      </div>
      <span class="ca-item-open"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
    </a>
  `).join('');
}

function renderUpdatedLabel() {
  const el = document.getElementById('caUpdated');
  if (!newsData.fetchedAt) { el.textContent = ''; return; }
  el.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#22c55e;"></i> Updated ${escapeHtml(timeAgo(newsData.fetchedAt))}`;

  const badge = document.getElementById('caSourceBadge');
  if (newsData.source === 'ai') {
    badge.textContent = 'AI-curated'; badge.style.background = 'var(--student-bg)'; badge.style.color = 'var(--current-accent)'; badge.style.display = 'inline';
  } else {
    badge.textContent = 'Live RSS'; badge.style.background = '#f0f4f8'; badge.style.color = '#64748b'; badge.style.display = 'inline';
  }
}

async function loadNews(forceRefresh) {
  const btn = document.getElementById('caRefreshBtn');
  if (btn) btn.classList.add('spinning');
  const isFirstLoad = !newsData.fetchedAt;
  if (isFirstLoad) {
    document.getElementById('caList').innerHTML = `<div class="empty-hint"><i class="fa-solid fa-spinner fa-spin" style="opacity:.5; font-size:18px;"></i><br><br>Loading the latest headlines…</div>`;
  }

  try {
    const resp = await fetch(NEWS_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task: 'news', forceRefresh: !!forceRefresh })
    });
    let data;
    try { data = await resp.json(); } catch (e) { throw new Error('News service returned an unexpected response.'); }
    if (!resp.ok || data.error) throw new Error(data.error || 'Could not load the news feed right now.');

    newsData = data.result || { categories: {}, fetchedAt: new Date().toISOString() };
    renderTabs();
    renderNepalWidgets();
    renderConflictWatch();
    renderList();
    renderUpdatedLabel();
    if (forceRefresh) toast('Headlines refreshed.', 'success');
  } catch (err) {
    if (isFirstLoad) {
      document.getElementById('caList').innerHTML = `<div class="ca-error">
        <span><i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(err.message || 'Could not load the news feed.')}</span>
        <button type="button" class="ca-retry-btn" onclick="loadNews(true)">Retry</button>
      </div>`;
    } else {
      toast(err.message || 'Could not refresh headlines.', 'error');
    }
  } finally {
    if (btn) btn.classList.remove('spinning');
  }
}

renderTabs();
loadNews(false);
autoRefreshTimer = setInterval(() => loadNews(false), AUTO_REFRESH_MS);
window.addEventListener('beforeunload', () => { if (autoRefreshTimer) clearInterval(autoRefreshTimer); });
</script>

<script src="theme-engine.js"></script>
