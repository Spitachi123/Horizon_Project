<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ज्ञानSetu | AI Mind Map</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body.divedu { background: var(--bg-main); }
  .desk-wrap { max-width: 1300px; margin: 0 auto; padding: 24px 24px 40px; }
  .desk-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .desk-head h1 { font-size: 22px; font-weight: 800; display:flex; align-items:center; gap:10px; }
  .desk-head p { font-size:13px; color:var(--text-muted); margin-top:4px; }
  .mm-layout { display:grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .mm-layout { grid-template-columns: 1fr; } }
  .desk-panel { background: var(--surface-white); border:1px solid var(--panel-border); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); }
  .desk-panel h3 { font-size: 14.5px; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
  textarea#mmInput { width:100%; min-height: 260px; padding: 14px; border:1.5px solid var(--panel-border); border-radius: var(--radius-sm); background: var(--bg-main); font-size: 14px; line-height:1.6; resize: vertical; color: var(--text-main); }
  textarea#mmInput:focus { outline:none; border-color: var(--current-accent); background: var(--surface-white); }
  .desk-controls { display:flex; gap:10px; align-items:center; margin-top: 12px; flex-wrap:wrap; }
  .map-card { padding: 0; overflow: hidden; display:flex; flex-direction:column; min-height: 560px; }
  .map-toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 14px 18px; border-bottom: 1px solid var(--panel-border); flex-wrap:wrap; }
  .map-toolbar h3 { margin-bottom:0; }
  .map-tools { display:flex; gap:6px; }
  .map-tool-btn { border:1.5px solid var(--panel-border); background:var(--bg-main); color:var(--text-muted); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .map-tool-btn:hover { background:var(--student-bg); color:var(--current-accent); border-color: var(--current-accent); }
  .map-viewport { position:relative; flex:1; min-height: 500px; overflow:hidden; cursor:grab; background:
      radial-gradient(circle, rgba(120,134,250,0.10) 1px, transparent 1px) 0 0/22px 22px, var(--bg-main); }
  .map-viewport.grabbing { cursor:grabbing; }
  .map-viewport svg { width:100%; height:100%; display:block; }
  .mm-node-box {
    background: var(--surface-white);
    border: 1.5px solid var(--panel-border);
    border-radius: 10px;
    height: 100%;
    display:flex; align-items:center;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-main);
    line-height:1.25;
    overflow:hidden;
    box-shadow: 0 2px 6px rgba(30,41,59,.08);
    cursor:pointer;
    user-select:none;
  }
  .mm-node-box .clamp { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mm-node-box.root { color:#fff; font-size:14.5px; font-weight:800; justify-content:center; text-align:center; box-shadow: 0 8px 20px var(--current-glow); }
  .mm-node-box .collapse-dot { width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; font-size:9px; margin-right:6px; flex-shrink:0; }
  .empty-hint { color: var(--text-muted); font-size: 13.5px; text-align:center; padding: 80px 20px; }
  .ai-source-badge { font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; }
</style>
<link rel="stylesheet" href="theme-modes.css">
<link rel="stylesheet" href="nepali-theme.css">
</head>
<body class="divedu">
<div class="bg-glow blob-1"></div>
<div class="bg-glow blob-2"></div>

<div class="desk-wrap">
  <div class="desk-head">
    <div>
      <h1><i class="fa-solid fa-diagram-project" style="color:var(--current-accent);"></i> AI Mind Map</h1>
      <p>Paste any chapter, article, or note (or upload a PDF) and get an interactive mind map of its ideas — branches you can click to expand or collapse.</p>
    </div>
    <span class="badge-pill"><i class="fa-solid fa-bolt"></i> Instant results</span>
  </div>

  <div class="mm-layout">
    <div class="desk-panel">
      <h3><i class="fa-solid fa-file-lines"></i> Source content</h3>
      <textarea id="mmInput" placeholder="Paste a paragraph, chapter, or set of notes here..."></textarea>
      <div class="desk-controls">
        <label class="len-btn" for="mmPdfInput" style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; border:1.5px solid var(--panel-border); background:var(--bg-main); color:var(--text-muted); padding:8px 14px; border-radius:20px; font-weight:700; font-size:12.5px;">
          <i class="fa-solid fa-file-pdf"></i> Upload PDF
        </label>
        <input type="file" id="mmPdfInput" accept="application/pdf" class="hidden">
        <span id="mmPdfStatus" style="font-size:11.5px; color:var(--text-muted);"></span>
      </div>
      <button class="btn-primary" style="width:100%; margin-top:18px;" onclick="runMindmap()"><i class="fa-solid fa-diagram-project"></i> Generate Mind Map</button>
    </div>

    <div class="desk-panel map-card">
      <div class="map-toolbar">
        <h3><i class="fa-solid fa-share-nodes"></i> Mind Map <span id="mmSourceBadge" class="ai-source-badge" style="display:none; margin-left:6px;"></span></h3>
        <div class="map-tools">
          <button class="map-tool-btn" title="Zoom in" onclick="mmZoom(1.2)"><i class="fa-solid fa-plus"></i></button>
          <button class="map-tool-btn" title="Zoom out" onclick="mmZoom(0.8)"><i class="fa-solid fa-minus"></i></button>
          <button class="map-tool-btn" title="Reset view" onclick="mmResetView()"><i class="fa-solid fa-compress"></i></button>
          <button class="map-tool-btn" title="Expand all" onclick="mmExpandAll()"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
        </div>
      </div>
      <div class="map-viewport" id="mmViewport">
        <div class="empty-hint" id="mmEmptyHint"><i class="fa-solid fa-diagram-project" style="opacity:.4; font-size:22px;"></i><br><br>Paste some text (or upload a PDF) on the left and hit <strong>Generate Mind Map</strong>.</div>
        <svg id="mmSvg" style="display:none;"><g id="mmZoomGroup"></g></svg>
      </div>
    </div>
  </div>
</div>

<div class="d-toast" id="toast"></div>

<script src="ai-engine.js"></script>
<script src="llm-engine.js"></script>
<script>
/* ============================================================
   AI Mind Map — renders a JSON tree (from LLMEngine.draftMindmap,
   real-Gemini or offline-structural) as an interactive, pannable,
   zoomable SVG mind map. Nodes are foreignObject boxes (so text
   wraps naturally); clicking a node collapses/expands its children.
   ============================================================ */

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'd-toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ---------------- PDF upload ---------------- */
document.getElementById('mmPdfInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('mmPdfStatus');
  statusEl.textContent = 'Reading PDF…';
  try {
    const text = await AIEngine.extractPdfText(file, (p, total) => { statusEl.textContent = `Reading page ${p}/${total}…`; });
    if (!text) { toast('Could not find any text in that PDF (it may be scanned images).', 'error'); statusEl.textContent = ''; return; }
    document.getElementById('mmInput').value = text;
    statusEl.textContent = `Loaded "${file.name}".`;
    toast('PDF text extracted — hit Generate Mind Map.', 'success');
  } catch (err) {
    toast(err.message || 'Could not read that PDF.', 'error');
    statusEl.textContent = '';
  }
});

/* Handoff from a dashboard's Materials tab, same pattern as h.html. */
window.addEventListener('message', async (event) => {
  const data = event.data || {};
  if (data.type === 'divedu-mindmap-load-text' && data.text) {
    document.getElementById('mmInput').value = data.text;
    runMindmap();
  } else if (data.type === 'divedu-mindmap-load-pdf-url' && data.url) {
    const statusEl = document.getElementById('mmPdfStatus');
    statusEl.textContent = `Fetching "${data.name || 'material'}"…`;
    try {
      const text = await AIEngine.extractPdfTextFromUrl(data.url, (p, total) => { statusEl.textContent = `Reading page ${p}/${total}…`; });
      document.getElementById('mmInput').value = text;
      statusEl.textContent = `Loaded "${data.name || 'material'}".`;
      runMindmap();
    } catch (err) {
      toast(err.message || 'Could not load that material.', 'error');
      statusEl.textContent = '';
    }
  }
});
try { window.parent.postMessage({ type: 'divedu-mindmap-ready' }, '*'); } catch (e) { /* ignore */ }

/* ---------------- Generate ---------------- */
async function runMindmap() {
  const text = document.getElementById('mmInput').value.trim();
  if (!text) { toast('Paste some text first.', 'error'); return; }

  const btn = document.querySelector('.desk-panel .btn-primary');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Thinking…'; }

  const { mindmap, source } = await LLMEngine.draftMindmap(text);

  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-diagram-project"></i> Generate Mind Map'; }

  if (!mindmap || !mindmap.title) { toast('Could not build a mind map from that text.', 'error'); return; }

  const badge = document.getElementById('mmSourceBadge');
  if (source === 'gemini') {
    badge.textContent = 'AI-generated'; badge.style.background = 'var(--student-bg)'; badge.style.color = 'var(--current-accent)'; badge.style.display = 'inline';
  } else {
    badge.textContent = 'Offline mode'; badge.style.background = '#fef3e2'; badge.style.color = '#f0a93a'; badge.style.display = 'inline';
  }

  document.getElementById('mmEmptyHint').style.display = 'none';
  document.getElementById('mmSvg').style.display = 'block';
  renderMindmap(mindmap);
  toast(source === 'gemini' ? 'Mind map generated by Gemini.' : 'Mind map generated (offline mode).', 'success');
}

/* ---------------- Layout + render ---------------- */
const BRANCH_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#0ea5e9', '#a855f7', '#14b8a6', '#f97316'];
const DEPTH_X = [40, 320, 600, 880];      // px, left edge per depth
const NODE_W  = [190, 180, 170, 160];     // px, box width per depth
const ROW_H = 54;

let currentTree = null;
let viewState = { scale: 1, tx: 0, ty: 0 };

function leafCount(node) {
  if (!node.children || node.children.length === 0 || node.__collapsed) return 1;
  return node.children.reduce((sum, c) => sum + leafCount(c), 0);
}

function layout(node, depth, y0, y1) {
  node.__x = DEPTH_X[Math.min(depth, DEPTH_X.length - 1)];
  node.__w = NODE_W[Math.min(depth, NODE_W.length - 1)];
  node.__y = (y0 + y1) / 2;
  node.__depth = depth;
  if (!node.children || node.children.length === 0 || node.__collapsed) return;
  let cursor = y0;
  node.children.forEach(child => {
    const span = leafCount(child) * ROW_H;
    layout(child, depth + 1, cursor, cursor + span);
    cursor += span;
  });
}

function renderMindmap(tree) {
  currentTree = tree;
  layout(tree, 0, 0, leafCount(tree) * ROW_H);
  tagColors(tree, null);
  draw();
  mmResetView();
}

function collectNodes(node, list) {
  list.push(node);
  if (node.children && !node.__collapsed) node.children.forEach(c => collectNodes(c, list));
  return list;
}
function collectEdges(node, list) {
  if (node.children && !node.__collapsed) {
    node.children.forEach(c => { list.push([node, c]); collectEdges(c, list); });
  }
  return list;
}

let nodeIdCounter = 0;
function draw() {
  const svg = document.getElementById('mmSvg');
  const group = document.getElementById('mmZoomGroup');
  const nodes = collectNodes(currentTree, []);
  const edges = collectEdges(currentTree, []);
  nodes.forEach(n => { if (!n.__id) n.__id = 'mmn' + (nodeIdCounter++); });

  const maxY = Math.max(...nodes.map(n => n.__y)) + 40;
  const maxX = Math.max(...nodes.map(n => n.__x + n.__w)) + 40;
  svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY + 40}`);

  let html = '';
  edges.forEach(([a, b]) => {
    const color = b.__color || '#94a3b8';
    const x1 = a.__x + a.__w, y1 = a.__y + 20;
    const x2 = b.__x, y2 = b.__y + 20;
    const mx = (x1 + x2) / 2;
    html += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${color}" stroke-width="2" opacity="0.55"/>`;
  });

  nodes.forEach((n) => {
    const isRoot = n.__depth === 0;
    const hasKids = n.children && n.children.length > 0;
    const boxStyle = isRoot
      ? `background:linear-gradient(135deg, var(--current-accent), var(--sky-accent));`
      : `border-color:${n.__color}66;`;
    html += `<foreignObject x="${n.__x}" y="${n.__y}" width="${n.__w}" height="40">
      <div xmlns="http://www.w3.org/1999/xhtml" class="mm-node-box${isRoot ? ' root' : ''}" style="${boxStyle}" onclick="mmToggle('${n.__id}')" title="${escapeAttr(n.label || n.title)}">
        ${hasKids ? `<span class="collapse-dot">${n.__collapsed ? '+' : '−'}</span>` : ''}
        <span class="clamp">${escapeHtml(n.label || n.title)}</span>
      </div>
    </foreignObject>`;
  });

  group.innerHTML = html;
}

/** Assigns each node a color: depth-1 nodes get one color per branch
 *  (cycling the palette), and every descendant inherits its depth-1
 *  ancestor's color, so a whole branch reads as one visual group. */
function tagColors(node, color) {
  node.__color = node.__depth === 0 ? null : color;
  if (node.children) {
    node.children.forEach((c, i) => {
      tagColors(c, node.__depth === 0 ? BRANCH_COLORS[i % BRANCH_COLORS.length] : color);
    });
  }
}

function findNodeById(node, id) {
  if (node.__id === id) return node;
  if (!node.children) return null;
  for (const c of node.children) {
    const found = findNodeById(c, id);
    if (found) return found;
  }
  return null;
}

function mmToggle(id) {
  const node = findNodeById(currentTree, id);
  if (!node || !node.children || node.children.length === 0) return;
  node.__collapsed = !node.__collapsed;
  layout(currentTree, 0, 0, leafCount(currentTree) * ROW_H);
  tagColors(currentTree, null);
  draw();
}

function mmExpandAll() {
  function walk(n) { n.__collapsed = false; if (n.children) n.children.forEach(walk); }
  if (currentTree) {
    walk(currentTree);
    layout(currentTree, 0, 0, leafCount(currentTree) * ROW_H);
    tagColors(currentTree, null);
    draw();
  }
}

/* ---------------- Pan & zoom ---------------- */
function applyTransform() {
  document.getElementById('mmZoomGroup').setAttribute('transform', `translate(${viewState.tx},${viewState.ty}) scale(${viewState.scale})`);
}
function mmZoom(factor) {
  viewState.scale = Math.max(0.3, Math.min(2.5, viewState.scale * factor));
  applyTransform();
}
function mmResetView() {
  viewState = { scale: 1, tx: 20, ty: 20 };
  applyTransform();
}

(function setupPanZoom() {
  const vp = document.getElementById('mmViewport');
  let dragging = false, lastX = 0, lastY = 0;
  vp.addEventListener('mousedown', (e) => {
    if (e.target.closest('.mm-node-box')) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY; vp.classList.add('grabbing');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    viewState.tx += (e.clientX - lastX); viewState.ty += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; vp.classList.remove('grabbing'); });
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    mmZoom(e.deltaY < 0 ? 1.08 : 0.93);
  }, { passive: false });
})();

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function escapeAttr(str) { return escapeHtml(str).replace(/"/g, '&quot;'); }
</script>
<script src="lang-engine.js"></script>
<script src="theme-engine.js"></script>
</body>
</html>
